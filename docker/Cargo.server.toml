[workspace]
members = ["server", "lib"]
resolver = "2"

[workspace.dependencies]
bitcoin = { version = "0.30.1", features = ["serde", "base64", "rand-std", "std"], default-features = false }
bip39 = "2.0"
bech32 = { version = "0.9.1", default-features = false }
secp256k1-zkp = { git = "https://github.com/ssantos21/rust-secp256k1-zkp.git", branch = "blinded-musig-scheme", features = ["rand-std", "bitcoin_hashes", "std"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
hex = "0.4.3"
uuid = { version = "1.3.1", features = ["v4", "serde"] }
rand = "0.8.5"
chrono = "0.4.31"
sha2 = "0.10.8"
log = "0.4.22"
env_logger = "0.11.5"
thiserror = "1.0.59"
reqwest = { version = "0.11.16", features = ["blocking", "json", "socks"] }
config = "0.13.1"
rocket = { version = "0.5.0", features = ["json"] }
sqlx = { version = "0.8.1", features = ["runtime-tokio", "time", "uuid", "migrate", "macros"], default-features = false }
schemars = { version = "0.8.12", features = ["chrono", "uuid"] }
ecies = { version = "0.2.7", default-features = false, features = ["pure"] }
uniffi = { version = "0.27.1", features = ["cli"] }
nostr-sdk = "0.37.0"
mercurylib = { path = "lib" }
